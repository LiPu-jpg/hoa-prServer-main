# Nginx vhost template for blog domain placeholder
#
# Replace the upstream according to how you deploy the blog:
# - If blog is another docker container bound to localhost:1313, proxy_pass to 127.0.0.1:1313
# - If blog is static files on disk, use root + try_files

server {
    listen 80;
    server_name jiulipule.com www.jiulipule.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Option A: reverse proxy to a local blog server
    # location / {
    #     proxy_pass http://127.0.0.1:1313;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Option B: serve static site
    root /var/www/jiulipule;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
