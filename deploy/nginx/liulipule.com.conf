# Nginx vhost template for prServer web/api
#
# Purpose:
# - Expose prServer (running on 127.0.0.1:8000 via docker compose) to the public
# - Route by Host header (one server can host many domains on the same 80/443)
#
# Notes:
# - Put this file under your nginx site dir, e.g.
#   - /etc/nginx/conf.d/liulipule.com.conf  (CentOS/RHEL style)
#   - /etc/nginx/sites-available/liulipule.com.conf + symlink to sites-enabled (Debian/Ubuntu)
# - Then run: nginx -t && systemctl reload nginx
#
# HTTP only (minimal). If you already have TLS, copy this server block to 443 and add cert config.

server {
    listen 80;
    server_name liulipule.com www.liulipule.com;

    # If you use Certbot later, you may want to keep this for ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep-alive
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
